# RK3399 SW799 (4G LPDDR4 / 16G eMMC, "bozz" TV-box board).
#
# Base image: Armbian trixie server from ophub/amlogic-s9xxx-armbian.
#
# Device tree: the OpenNexusCN kernel publishes rk3399-bozz-sw799-otg.dtb.
# The board's J23 micro-USB connector is the OTG port (TYPEC0 / DWC3_0);
# the stock DTS disables it, and the -otg variant enables u2phy0_otg and
# DWC3_0 with the same role-switch setup as the other RK3399 boards.
# That gives One-KVM a peripheral UDC for HID (mouse/keyboard), mass
# storage (virtual CD-ROM) and UVC.  DWC3_1 remains the stock host port.
# The DTS lives in the kernel repo at
# arch/arm64/boot/dts/rockchip/rk3399-bozz-sw799-otg.dts.

BOARD_ID="sw799"
BOARD_NAME="RK3399 SW799"
BOARD_DESCRIPTION="RK3399 SW799, Armbian trixie, One-KVM with micro-USB OTG"

SOC="rk3399"

BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
BASE_IMAGE_RELEASE="Armbian_trixie_arm64_server_2026.11"
BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_sw799_trixie_*_server_*.img.gz"
# 6.18.59 server 2026.11.02.
BASE_IMAGE_SHA256="23ffcfcdc59f00283fc7bfaa635bb5a753dc7aff35c4daffd8f39aebf444bd75"

KERNEL_DTB="rk3399-bozz-sw799-otg.dtb"

# The base rootfs has ~860 MiB free; the custom modules, the One-KVM
# package and the Android/FFmpeg packages need more room.
IMAGE_EXTRA_MB="2048"

# Debian trixie ships FFmpeg 7, while the 3rd/scrcpy-3.3-aarch64 binary was
# linked against noble's FFmpeg 6 SONAMEs.  Use the trixie-backports
# package (scrcpy 3.3.4) instead.
ANDROID_SCRCPY_MODE="distro"
ANDROID_SCRCPY_APT_SUITE="trixie-backports"

ONE_KVM_ENABLED="true"
