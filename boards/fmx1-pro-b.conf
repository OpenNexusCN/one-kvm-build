# FMX1 Pro, "B" board revision (RK3399, 4G RAM / 32G eMMC).
#
# The B revision uses rk3399-op1.dtsi in the kernel and may need its own OTG
# device tree in the future.  Until one exists, follow the current build
# process and use the generic fmx1-pro-otg DTB; switch KERNEL_DTB to
# rk3399-fmx1-pro-b.dtb if a particular unit does not boot or its Type-C port
# is not wired for peripheral mode.

BOARD_ID="fmx1-pro-b"
BOARD_NAME="FMX1 Pro (B board)"
BOARD_DESCRIPTION="RK3399 FMX1 Pro B revision, Armbian noble, One-KVM"

SOC="rk3399"

BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
BASE_IMAGE_RELEASE="Armbian_noble_arm64_server_2026.11"
BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_fmx1-pro-b_noble_*_server_*.img.gz"
BASE_IMAGE_SHA256="bd1efdc3a922ea8e8d2ab4e337089fe08961f46a7a0b743d8e212f5f9b57a71d"

KERNEL_DTB="rk3399-fmx1-pro-otg.dtb"

ONE_KVM_ENABLED="true"
