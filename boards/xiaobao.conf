# xiaobao (RK3399).
#
# Base image: Armbian trixie server from ophub/amlogic-s9xxx-armbian.
# Device tree: the OpenNexusCN kernel publishes the -otg variant below;
# it enables the maskrom/flashing OTG port with the same role-switch
# setup as the other RK3399 boards (dr_mode=otg, default peripheral).

BOARD_ID="xiaobao"
BOARD_NAME="xiaobao"
BOARD_DESCRIPTION="xiaobao, Armbian trixie, One-KVM"

SOC="rk3399"

BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
BASE_IMAGE_RELEASE="Armbian_trixie_arm64_server_2026.11"
BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_xiaobao_trixie_*_server_*.img.gz"
# Armbian_26.11.0_rockchip_xiaobao_trixie_6.18.59_server_2026.11.02.img.gz
BASE_IMAGE_SHA256="66fc3ad899523e344acc12e3f06e23ce60d2c187406df15840074ed02e1b2ce2"

KERNEL_DTB="rk3399-xiaobao-otg.dtb"

IMAGE_EXTRA_MB="2048"

ANDROID_SCRCPY_MODE="distro"
ANDROID_SCRCPY_APT_SUITE="trixie-backports"

ONE_KVM_ENABLED="true"
