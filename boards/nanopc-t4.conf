# FriendlyElec NanoPC-T4 (RK3399, 4G RAM / 16G eMMC).
#
# Base image: Armbian trixie server from ophub/amlogic-s9xxx-armbian.
#
# Device tree: the upstream Armbian image already ships
# rk3399-nanopc-t4.dtb with the USB-C port wired as the dwc3 OTG port
# (usbdrd_dwc3_0 dr_mode="otg").  The OpenNexusCN kernel release currently
# publishes only the FMX1 DTBs, so KERNEL_DTB_FROM_BASE_IMAGE keeps this DTB;
# components/nanopc-t4/pre-install.d/10-usb-otg-dts.sh then decompiles it,
# appends the OTG fragment and recompiles it so One-KVM gets a peripheral
# UDC for HID (mouse/keyboard), mass storage (virtual CD-ROM) and UVC.
# If a future kernel release includes this DTB, it is used automatically.

BOARD_ID="nanopc-t4"
BOARD_NAME="FriendlyElec NanoPC-T4"
BOARD_DESCRIPTION="RK3399 NanoPC-T4, Armbian trixie, One-KVM with USB-C OTG"

SOC="rk3399"

BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
BASE_IMAGE_RELEASE="Armbian_trixie_arm64_server_2026.11"
BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_nanopc-t4_trixie_*_server_*.img.gz"
# 6.18.63 server 2026.11.14 (the release also carries a 6.18.59 build).
BASE_IMAGE_SHA256="8857b0ad5a3df28d0bda10bc13b2c71b9543b735d408fa09da9d86b8f23f1bb0"

KERNEL_DTB="rk3399-nanopc-t4.dtb"
KERNEL_DTB_FROM_BASE_IMAGE="true"

# The base rootfs has ~860 MiB free; the custom modules, the One-KVM
# package and the Android/FFmpeg development packages need more room.
IMAGE_EXTRA_MB="2048"

ONE_KVM_ENABLED="true"
