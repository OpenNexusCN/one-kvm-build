# FriendlyElec NanoPC-T4 (RK3399, 4G RAM / 16G eMMC).
#
# Base image: Armbian trixie server from ophub/amlogic-s9xxx-armbian.
#
# Device tree: the OpenNexusCN kernel publishes rk3399-nanopc-t4-otg.dtb,
# which keeps the USB-C dwc3 port in OTG mode and defaults its role switch
# to peripheral.  That gives One-KVM a UDC for HID (mouse/keyboard), mass
# storage (virtual CD-ROM) and UVC.  The DTS lives in the kernel repo at
# arch/arm64/boot/dts/rockchip/rk3399-nanopc-t4-otg.dts.

BOARD_ID="nanopc-t4"
BOARD_NAME="FriendlyElec NanoPC-T4"
BOARD_DESCRIPTION="RK3399 NanoPC-T4, Armbian trixie, One-KVM with USB-C OTG"

SOC="rk3399"

BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
BASE_IMAGE_RELEASE="Armbian_trixie_arm64_server_2026.11"
BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_nanopc-t4_trixie_*_server_*.img.gz"
# 6.18.63 server 2026.11.14 (the release also carries a 6.18.59 build).
BASE_IMAGE_SHA256="8857b0ad5a3df28d0bda10bc13b2c71b9543b735d408fa09da9d86b8f23f1bb0"

KERNEL_DTB="rk3399-nanopc-t4-otg.dtb"

# The base rootfs has ~860 MiB free; the custom modules, the One-KVM
# package and the Android/FFmpeg packages need more room.
IMAGE_EXTRA_MB="2048"

# Debian trixie ships FFmpeg 7, but the 3rd/scrcpy-3.3-aarch64 binary was
# linked against noble's FFmpeg 6 SONAMEs.  Use the trixie-backports
# package (scrcpy 3.3.4) instead; the image already has the backports suite
# in /etc/apt/sources.list.d/debian.sources.
ANDROID_SCRCPY_MODE="distro"
ANDROID_SCRCPY_APT_SUITE="trixie-backports"

ONE_KVM_ENABLED="true"
