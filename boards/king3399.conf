# King3399 (RK3399).
#
# Base image: Armbian trixie server from ophub/amlogic-s9xxx-armbian.
# Device tree: the OpenNexusCN kernel publishes the -otg variant below;
# it enables the maskrom/flashing OTG port with the same role-switch
# setup as the other RK3399 boards (dr_mode=otg, default peripheral).

BOARD_ID="king3399"
BOARD_NAME="King3399"
BOARD_DESCRIPTION="King3399, Armbian trixie, One-KVM"

SOC="rk3399"

BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
BASE_IMAGE_RELEASE="Armbian_trixie_arm64_server_2026.11"
BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_king3399_trixie_*_server_*.img.gz"
# Armbian_26.11.0_rockchip_king3399_trixie_6.18.63_server_2026.11.14.img.gz
BASE_IMAGE_SHA256="35db40ee9712fa28084a71d3484a4a0748b643ff5e252a8cb6b4d049971b5896"

KERNEL_DTB="rk3399-king3399-otg.dtb"

IMAGE_EXTRA_MB="2048"

ANDROID_SCRCPY_MODE="distro"
ANDROID_SCRCPY_APT_SUITE="trixie-backports"

ONE_KVM_ENABLED="true"
# Not enabled for `--boards all` until the USB OTG port is verified.
ENABLED="false"
