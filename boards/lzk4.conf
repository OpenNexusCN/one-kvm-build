BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_lzk4_trixie_*_server_*.img.gz"
# Armbian_26.11.0_rockchip_lzk4_trixie_6.18.63_server_2026.11.14.img.gz
BASE_IMAGE_SHA256="a441b878be8d50f3e4aa487957d24786b91df830ef04e267404a23bb8571c0bb"

KERNEL_DTB="rk3399-lzk4-otg.dtb"

IMAGE_EXTRA_MB="2048"

ANDROID_SCRCPY_MODE="distro"
