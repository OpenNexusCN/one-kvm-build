# CMCC-HD9901 (RK3399).
#
# Base image: Armbian trixie server from ophub/amlogic-s9xxx-armbian.
# Device tree: the OpenNexusCN kernel publishes the -otg variant below;
# it enables the maskrom/flashing OTG port with the same role-switch
# setup as the other RK3399 boards (dr_mode=otg, default peripheral).
# HD9901 has no DTS in the kernel source yet, so this board keeps
# the base image DTB (KERNEL_DTB_FROM_BASE_IMAGE).

BOARD_ID="hd9901"
BOARD_NAME="CMCC-HD9901"
BOARD_DESCRIPTION="CMCC-HD9901, Armbian trixie, One-KVM"

SOC="rk3399"

BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
BASE_IMAGE_RELEASE="Armbian_trixie_arm64_server_2026.11"
BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_hd9901_trixie_*_server_*.img.gz"
# Armbian_26.11.0_rockchip_hd9901_trixie_6.18.63_server_2026.11.16.img.gz
BASE_IMAGE_SHA256="ab86ad0d46fc9551729863e3bb498eb73e20c84973931ae3567a87b5cf7f15b1"

KERNEL_DTB="rk3399-hd9901.dtb"
KERNEL_DTB_FROM_BASE_IMAGE="true"

IMAGE_EXTRA_MB="2048"

ANDROID_SCRCPY_MODE="distro"
ANDROID_SCRCPY_APT_SUITE="trixie-backports"

ONE_KVM_ENABLED="true"
# Not enabled for `--boards all` until the USB OTG port is verified.
ENABLED="false"
