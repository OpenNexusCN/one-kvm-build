# Firefly-Core-3399-JD4 (RK3399).
#
# Base image: Armbian trixie server from ophub/amlogic-s9xxx-armbian.
# Device tree: the OpenNexusCN kernel publishes the -otg variant below;
# it enables the maskrom/flashing OTG port with the same role-switch
# setup as the other RK3399 boards (dr_mode=otg, default peripheral).

BOARD_ID="firefly-jd4"
BOARD_NAME="Firefly-Core-3399-JD4"
BOARD_DESCRIPTION="Firefly-Core-3399-JD4, Armbian trixie, One-KVM"

SOC="rk3399"

BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
BASE_IMAGE_RELEASE="Armbian_trixie_arm64_server_2026.11"
BASE_IMAGE_ASSET_PATTERN="Armbian_*_rockchip_firefly-jd4_trixie_*_server_*.img.gz"
# Armbian_26.11.0_rockchip_firefly-jd4_trixie_6.18.63_server_2026.11.14.img.gz
BASE_IMAGE_SHA256="22992fa32200afe9b289adfcdeea401a701a3bde74d5e337b4b480300ea57c4a"

KERNEL_DTB="rk3399-firefly-core-3399-jd4-otg.dtb"

IMAGE_EXTRA_MB="2048"

ANDROID_SCRCPY_MODE="distro"
ANDROID_SCRCPY_APT_SUITE="trixie-backports"

ONE_KVM_ENABLED="true"
