# Global build defaults.
#
# Every variable here can be overridden by a board file in boards/*.conf.
# The file is sourced by bash, so keep values shell-quoted.

# ---------------------------------------------------------------------------
# Board / image identity
# ---------------------------------------------------------------------------
# Family hook used to mount the image and update its boot configuration.
# Implemented families live in scripts/families/<family>.sh.
SOC_FAMILY="rockchip"

# Set to "false" to hide a board from `--boards all` while keeping it around.
ENABLED="true"

# Hostname written into the image (empty string keeps the base image value).
IMAGE_HOSTNAME="one-kvm"

# Grow the root partition before adding packages.  The Armbian fmx1 images
# have ~500 MiB free, which is not enough for a full kernel module tree plus
# One-KVM.  The image is expanded again on first boot by Armbian.
IMAGE_EXTRA_MB="1024"

# Remove the base image kernel (Image, modules, initrd) after a successful
# install.  Keeping it provides a fallback in U-Boot but costs disk space.
PRUNE_OLD_KERNEL="false"

# Fail the build when the initramfs cannot be regenerated for the new kernel.
REQUIRE_INITRD_REGEN="true"

# ---------------------------------------------------------------------------
# Base image (Armbian from ophub)
# ---------------------------------------------------------------------------
BASE_IMAGE_REPO="ophub/amlogic-s9xxx-armbian"
# Release tag, or "latest" to search matching releases newest first.
BASE_IMAGE_RELEASE="latest"
# Tag glob used when BASE_IMAGE_RELEASE="latest".
BASE_IMAGE_TAG_PATTERN="Armbian_*"
# Asset glob. Boards normally override this.
BASE_IMAGE_ASSET_PATTERN=""
# Optional pinned URL / SHA-256.  When BASE_IMAGE_URL is set, no API lookup
# is performed for the base image.
BASE_IMAGE_URL=""
BASE_IMAGE_SHA256=""

# ---------------------------------------------------------------------------
# Kernel release (OpenNexusCN/rk-linux-6.18.y)
# ---------------------------------------------------------------------------
KERNEL_REPO="OpenNexusCN/rk-linux-6.18.y"
KERNEL_GIT_URL="https://github.com/OpenNexusCN/rk-linux-6.18.y.git"
# Release tag, or "latest".
KERNEL_RELEASE="latest"
KERNEL_TAG_PATTERN="V*"

KERNEL_IMAGE_PATTERN="Image-*"
KERNEL_CONFIG_PATTERN="config-*"
KERNEL_SYSTEMMAP_PATTERN="System.map-*"
KERNEL_MODULES_PATTERN="modules-*.tar.gz"
KERNEL_DTB_PATTERN="*.dtb"

# If the release does not contain a modules tarball (the current kernel
# workflow builds Image/DTBs only), rebuild the matching modules from the
# released kernel source and the released config.  This is required: most
# One-KVM gadget options are built as modules.
KERNEL_MODULES_FALLBACK="true"

# Cross compiler used for the module fallback.
KERNEL_ARCH="arm64"
KERNEL_CROSS_COMPILE="aarch64-linux-gnu-"

# ---------------------------------------------------------------------------
# One-KVM package
# ---------------------------------------------------------------------------
ONE_KVM_ENABLED="true"
# The fork used by 流程.txt.  Its CI publishes deb and tar.gz assets; the
# resolver waits for the arm64 deb to appear.  Set this to mofeng-git/One-KVM
# to use the upstream package instead.
ONE_KVM_REPO="zoneBen/One-KVM"
# Release tag, or "latest".
ONE_KVM_RELEASE="latest"
ONE_KVM_ASSET_PATTERN="one-kvm_*_arm64.deb"
# Ignore releases whose package version is older than this.
ONE_KVM_MIN_VERSION="0.2.9"
# Seconds to wait for a matching release asset at plan time (0 = no wait).
ONE_KVM_WAIT_SECONDS="0"

# ---------------------------------------------------------------------------
# Extra apt packages
# ---------------------------------------------------------------------------
# Space-separated package names installed into the image with apt.  Boards can
# extend this list; the workflow_dispatch input apt_packages is appended too.
APT_PACKAGES=""
APT_INSTALL_RECOMMENDS="false"

# ---------------------------------------------------------------------------
# Wi-Fi AP + captive portal
# ---------------------------------------------------------------------------
WIFI_AP_ENABLED="true"
# Empty = auto-detect the first phy80211 interface at first boot.
WIFI_AP_INTERFACE=""
# SSID = <prefix><hash>; the hash is 6 uppercase hex chars derived from the
# device machine-id and Wi-Fi MAC at first boot.
WIFI_AP_SSID_PREFIX="OneKVM-"
WIFI_AP_HASH_LENGTH="6"
# open = no passphrase (typical captive-portal setup); wpa2 = WPA2-PSK.
WIFI_AP_SECURITY="open"
# WPA2 passphrase, 8-63 alphanumeric characters.  Empty means generate one on
# first boot and write it to /boot/one-kvm-wifi.txt and /etc/one-kvm-wifi/.
WIFI_AP_PASSWORD=""
WIFI_AP_COUNTRY="CN"
WIFI_AP_CHANNEL="6"
WIFI_AP_IP="192.168.4.1"
WIFI_AP_DHCP_START="192.168.4.10"
WIFI_AP_DHCP_END="192.168.4.100"
# One-KVM listens on 8080; the portal redirects there.
WIFI_AP_PORTAL_PORT="8080"
# Packages installed when WIFI_AP_ENABLED=true.
WIFI_AP_PACKAGES="hostapd dnsmasq lighttpd iw"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
# Tokens: {armbian_version} {platform} {board} {base_board} {codename}
#         {kernel} {onekvm_version} {base_date} {timestamp} {ext}
OUTPUT_NAME_TEMPLATE="Armbian_{armbian_version}_rockchip_{board}_{codename}-onekvm_{kernel}_server_{base_date}.img.{ext}"
OUTPUT_COMPRESS="gz"        # gz | xz | zst
OUTPUT_DIR="out"
WORK_DIR="work"

# ---------------------------------------------------------------------------
# Components / overlays
# ---------------------------------------------------------------------------
# Optional per-board component trees.  See components/README.md.
APPLY_COMPONENTS="true"
COMPONENTS_DIR="components"
